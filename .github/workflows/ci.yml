name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: native-binaries
          path: dist/jumpotp-*
          if-no-files-found: error

  package-consumer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - run: ./scripts/build.sh
      - run: node scripts/prepare-packages.mjs
      - run: node scripts/audit-packages.mjs
      - run: node scripts/test-packages.mjs
